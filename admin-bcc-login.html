<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Admin Access | Nariyal Sutra</title><link rel="stylesheet" href="assets/css/auth-shell.css"></head>
<body class="ns-auth-page"><main id="ns-admin-auth">
<h1 class="ns-auth-title" id="ns-admin-title" tabindex="-1">Welcome back.</h1>
<p class="ns-auth-sub" id="ns-admin-sub">Sign in to your Nariyal Sutra workspace.</p>
<form id="login" data-auth-mode="signin">
<div><label for="email">Staff email</label><input autocomplete="username" id="email" type="email" placeholder="you@example.com" required></div>
<div id="ns-admin-password"><label for="pw">Password</label><input autocomplete="current-password" id="pw" type="password" placeholder="Your password" required></div>
<button class="ns-auth-primary" id="submit" type="submit" disabled>Sign in</button>
<button class="ns-auth-text" id="forgot" type="button">Forgot password?</button>
<button class="ns-auth-text" id="ns-admin-back" type="button" hidden>Back to sign in</button>
</form><div class="msg" id="msg" role="status" aria-live="polite" aria-atomic="true"></div>
<p class="ns-auth-note">For invited team members only. Access requires a verified email and an active assigned role. Need an invitation? Contact your workspace owner.</p>
</main><script src="assets/js/auth-shell.js"></script><script src="assets/js/admin-auth-ui.js"></script><script src="/firebase-config.js"></script><script type="module">
const SDK='12.18.0',cfg=window.NS_FIREBASE_CONFIG||{},owner=window.NS_ADMIN_CONFIG?.ownerUid||'',ownerEmail=window.NS_ADMIN_CONFIG?.ownerEmail||'',msg=document.getElementById('msg'),btn=document.getElementById('submit');
try {
const [{initializeApp,getApps,getApp},{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,sendEmailVerification,sendPasswordResetEmail},{getFirestore,doc,getDoc}]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${SDK}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${SDK}/firebase-auth.js`),import(`https://www.gstatic.com/firebasejs/${SDK}/firebase-firestore.js`)]);
if(!cfg.apiKey||!cfg.projectId||!cfg.appId){msg.className='msg err';msg.textContent='Production Firebase configuration is unavailable.';throw new Error('Firebase configuration unavailable');}
const app=getApps().length?getApp():initializeApp(cfg);if(typeof window.NS_INIT_APP_CHECK==='function')await window.NS_INIT_APP_CHECK(app);const auth=getAuth(app),db=getFirestore(app);
const norm=v=>String(v||'').trim().toLowerCase();
function safeAdminNext(raw){
  try{const u=new URL(raw||'admin-preview.html',location.origin);if(u.origin!==location.origin)return '/admin-preview.html';const clean=u.pathname.replace(/^\/+|\/+$/g,'');if(!['admin-preview.html','admin.html','admin'].includes(clean))return '/admin-preview.html';return u.pathname+u.search+u.hash;}catch{return '/admin-preview.html';}
}
const next=safeAdminNext(new URLSearchParams(location.search).get('next'));
async function roleOf(u){
  if(!u?.emailVerified||!u?.email)return '';
  if(u.uid===owner)return norm(u.email)===norm(ownerEmail)?'Owner':'';
  try{const s=await getDoc(doc(db,'adminRoles',u.uid));if(!s.exists())return '';const x=s.data()||{},r=String(x.role||'');if(!['Admin','Manager','Operations','Content','Support','Sales'].includes(r))return '';if(x.status!=='Active'||x.active!==true||norm(x.email)!==norm(u.email))return '';return r;}catch{return '';}
}
let entering=null;
async function enter(u){
  if(!u)return;
  if(entering)return entering;
  entering=(async()=>{
    const isConfiguredOwner=norm(u.email)===norm(ownerEmail);
    if(isConfiguredOwner&&!u.emailVerified){
      try{
        await sendEmailVerification(u);
        msg.className='msg ok';
        msg.textContent='Owner email verification sent to '+u.email+'. Verify it, then sign in again.';
      }catch(_){
        msg.className='msg err';
        msg.textContent='The Owner email is not verified and the verification email could not be sent. Please retry shortly.';
      }
      await signOut(auth).catch(()=>{});
      return;
    }
    if(isConfiguredOwner&&u.emailVerified&&u.uid!==owner){
      msg.className='msg err';
      msg.textContent='The verified Owner email is correct, but its Firebase identity no longer matches the configured Owner binding.';
      await signOut(auth).catch(()=>{});
      return;
    }
    const r=await roleOf(u);
    if(!r){msg.className='msg err';msg.textContent='This verified account does not have active Business Command Center access.';await signOut(auth).catch(()=>{});return;}
    msg.className='msg ok';msg.textContent='Authenticated as '+r+'. Opening Admin…';location.replace(next);
  })();
  try{return await entering;}finally{entering=null;}
}
onAuthStateChanged(auth,u=>{if(u)enter(u)});
btn.disabled=false;
document.getElementById('login').addEventListener('submit',async e=>{
  e.preventDefault();const form=e.currentTarget;if(form.getAttribute('aria-busy')==='true')return;
  const reset=form.dataset.authMode==='reset';btn.disabled=true;form.setAttribute('aria-busy','true');
  msg.className='msg';msg.textContent=reset?'Requesting reset instructions…':'Signing in…';
  try{
    if(reset){
      try{await sendPasswordResetEmail(auth,document.getElementById('email').value.trim());}
      catch(err){if(err.code!=='auth/user-not-found')throw err;}
      msg.className='msg ok';msg.textContent='If this email has an account, reset instructions have been requested. Check your inbox and spam folder.';
    }else{await signInWithEmailAndPassword(auth,document.getElementById('email').value.trim(),document.getElementById('pw').value);}
  }catch(err){msg.className='msg err';msg.textContent=reset?'We could not request a reset right now. Please try again shortly.':'Sign-in failed. Check your email/password, verified-email status and active role access.';}
  finally{btn.disabled=false;form.removeAttribute('aria-busy');}
});
}catch(error){msg.className='msg err';msg.textContent='Secure sign-in is temporarily unavailable. Please reload to try again.';btn.disabled=true;}
</script></body></html>
