name: Build V42.1 Cinematic Package

on:
  push:
    branches:
      - fix/v42-1-cinematic-storefront-20260910
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4

      - name: Hydrate Netlify-only binary and legacy assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          root=Path('.')
          hosts=['https://6a9bfce307bb9f014e510b7d--nariyal-sutra.netlify.app','https://nariyal-sutra.netlify.app']
          text_ext={'.html','.css','.js','.json','.xml','.txt','.md','.toml'}
          files=[p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in text_ext and '.git' not in p.parts and '.github' not in p.parts]
          refs=set(); pat=re.compile(r'https://(?:6a9bfce307bb9f014e510b7d--)?nariyal-sutra\.netlify\.app/(assets/[A-Za-z0-9_./@+%=-]+)')
          for p in files:
            try:s=p.read_text(encoding='utf-8')
            except Exception:continue
            for m in pat.finditer(s): refs.add(m.group(1).split('?')[0].split('#')[0])
          optional={'assets/js/v421-admin.js','assets/js/v421-catalog.js'}
          failures=[]
          for rel in sorted(refs):
            dest=root/rel
            if dest.exists() and dest.stat().st_size>0: continue
            dest.parent.mkdir(parents=True,exist_ok=True); ok=False
            for host in hosts:
              cp=subprocess.run(['curl','-fsSL','--retry','2','--connect-timeout','12','-o',str(dest),f'{host}/{rel}'])
              if cp.returncode==0 and dest.exists() and dest.stat().st_size>0: ok=True; break
              try:dest.unlink()
              except FileNotFoundError:pass
            if not ok and rel not in optional: failures.append(rel)
          print('Hydrated refs:',len(refs),'hard failures:',len(failures))
          for x in failures: print('MISSING_REMOTE',x)
          if failures: raise SystemExit('Required Netlify asset hydration failed')
          PY

      - name: Build complete source package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release
          mkdir -p .release/site
          rsync -a --exclude='.git' --exclude='.github' --exclude='.release' ./ .release/site/
          cd .release/site
          zip -r -9 ../NARIYAL_SUTRA_V42_1_FULL_SOURCE.zip .
          cd ../..
          echo "File count: $(find .release/site -type f | wc -l)"
          echo "ZIP size: $(du -h .release/NARIYAL_SUTRA_V42_1_FULL_SOURCE.zip | cut -f1)"

      - name: Upload complete source package
        uses: actions/upload-artifact@v4
        with:
          name: NARIYAL_SUTRA_V42_1_FULL_SOURCE
          path: .release/NARIYAL_SUTRA_V42_1_FULL_SOURCE.zip
          if-no-files-found: error
          retention-days: 7
