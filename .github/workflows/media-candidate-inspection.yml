name: Media candidate inspection
on:
  push:
    branches:
      - tmp/media-candidate-inspection-20260912
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/media-candidate-contact-sheet.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: media-candidate-contact-sheet
          path: qa-artifacts/
          retention-days: 2
