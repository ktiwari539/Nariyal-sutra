name: Netlify preview candidate

on:
  push:
    branches:
      - fix/final-v42-1-reconciled-20260911
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 231fa72c-f358-4efe-b8e6-3ca41a0932b5
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Verify Netlify authentication is configured
        shell: bash
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN GitHub Actions secret is not configured."
            exit 1
          fi

      - name: Create non-production Netlify preview
        shell: bash
        run: |
          npx --yes netlify-cli@latest deploy \
            --dir . \
            --functions netlify/functions \
            --site "$NETLIFY_SITE_ID" \
            --alias final-v42-1-preview \
            --message "V42.1 reconciled preview $GITHUB_SHA" \
            --json | tee /tmp/netlify-preview.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/netlify-preview.json','utf8')); console.log('PREVIEW_URL='+(x.deploy_url||x.url||'')); console.log('DEPLOY_ID='+(x.deploy_id||x.id||''));"
