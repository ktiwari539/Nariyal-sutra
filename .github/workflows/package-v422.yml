name: Package V42.3 asset-complete rain-restored fix

on:
  push:
    branches: [chatgpt/v421-cinematic-fix-20260910]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/v421-cinematic-fix-20260910

      - name: Prepare asset-complete deploy folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist && mkdir dist
          rsync -a --exclude='.git' --exclude='.github' --exclude='.build' ./ dist/
          python3 -m pip install --quiet pillow

          CUT_URL='https://images.pexels.com/photos/25049373/pexels-photo-25049373.jpeg?auto=compress&cs=tinysrgb&w=1800'
          FALLBACK_URL='https://images.pexels.com/photos/5945742/pexels-photo-5945742.jpeg?auto=compress&cs=tinysrgb&w=1800'
          curl -L --fail --retry 3 --connect-timeout 20 "$CUT_URL" -o dist/assets/images/ns-cut-cinematic.jpg || curl -L --fail --retry 3 --connect-timeout 20 "$FALLBACK_URL" -o dist/assets/images/ns-cut-cinematic.jpg
          test "$(wc -c < dist/assets/images/ns-cut-cinematic.jpg)" -gt 50000

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageFilter,ImageOps
          import re
          root=Path('dist'); images=root/'assets/images'; (images/'brand').mkdir(parents=True,exist_ok=True); (images/'cinematic').mkdir(parents=True,exist_ok=True)
          coastal=Image.open(images/'review/coastal-grove.png').convert('RGB')
          backwater=Image.open(images/'review/backwater-grove.png').convert('RGB')
          harvest=Image.open(images/'harvest-wall-organic.jpg').convert('RGB')
          cut=Image.open(images/'ns-cut-cinematic.jpg').convert('RGB')
          def fit(im,size): return ImageOps.fit(im,size,method=Image.Resampling.LANCZOS,centering=(.5,.5))

          # Build four photographic rain coconuts from the actual grove asset so light/texture match the scene.
          rgba=Image.open(images/'review/coastal-grove.png').convert('RGBA')
          boxes=[(380,190,452,280),(365,278,435,365),(305,302,382,390),(430,260,505,355)]
          sprites=[]
          for i,b in enumerate(boxes,1):
              cr=rgba.crop(b); mask=Image.new('L',cr.size,0); d=ImageDraw.Draw(mask); d.ellipse((3,3,cr.width-3,cr.height-3),fill=255); mask=mask.filter(ImageFilter.GaussianBlur(.5)); cr.putalpha(mask); cr=cr.resize((cr.width*3,cr.height*3),Image.Resampling.LANCZOS); out=images/'cinematic'/f'coconut-rain-{i}.png'; cr.save(out,optimize=True); sprites.append(cr)
          # v20 runtime intentionally uses sprites 1,3,4,5; alias 5 to a fifth variation derived from the source grove.
          b=(395,350,468,445); cr=rgba.crop(b); mask=Image.new('L',cr.size,0); ImageDraw.Draw(mask).ellipse((3,3,cr.width-3,cr.height-3),fill=255); mask=mask.filter(ImageFilter.GaussianBlur(.5)); cr.putalpha(mask); cr=cr.resize((cr.width*3,cr.height*3),Image.Resampling.LANCZOS); cr.save(images/'cinematic'/'coconut-rain-5.png',optimize=True)

          # Restore every historical image path still used by the storefront/pages, using normal local files.
          fit(coastal,(1600,1000)).save(images/'nariyal-premium-hero.webp','WEBP',quality=88)
          fit(backwater,(1600,1000)).save(images/'nariyal-hospitality.webp','WEBP',quality=88)
          fit(coastal,(1600,1000)).save(images/'nariyal-sutra-hero.jpg','JPEG',quality=90)
          fit(harvest,(1600,1000)).save(images/'nariyal-product-collection.webp','WEBP',quality=88)
          fit(coastal.crop((250,120,650,500)),(1200,1200)).save(images/'green-round-coconut.jpg','JPEG',quality=90)
          fit(harvest,(1400,900)).save(images/'bulk-coconut-pack.jpg','JPEG',quality=90)
          fit(coastal,(1600,1000)).save(images/'coconut-farm.jpg','JPEG',quality=90)
          fit(backwater,(1200,1200)).save(images/'brand'/'sourcing-portrait.webp','WEBP',quality=88)
          fit(cut,(1200,1200)).save(images/'brand'/'coconut-premium.webp','WEBP',quality=90)
          fit(coastal,(1600,900)).save(images/'intro-film-01.webp','WEBP',quality=86)
          fit(cut,(1600,900)).save(images/'intro-film-02.webp','WEBP',quality=86)
          fit(backwater,(1600,900)).save(images/'intro-film-03.webp','WEBP',quality=86)
          Image.open(images/'cinematic'/'coconut-rain-1.png').save(images/'story-coconut-hero.png',optimize=True)
          fit(cut,(1200,1200)).save(images/'story-coconut-body-cut.png','PNG',optimize=True)
          fit(cut,(900,700)).save(images/'story-coconut-cap-cut.png','PNG',optimize=True)

          old='https://6a9bfce307bb9f014e510b7d--nariyal-sutra.netlify.app/'
          text_ext={'.html','.css','.js','.json','.webmanifest'}
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in text_ext: continue
              t=p.read_text(errors='ignore'); before=t
              t=t.replace(old,'/')
              t=t.replace('https://nariyal-sutra.netlify.app/assets/images/','/assets/images/')
              t=t.replace('https://nariyal-sutra.netlify.app/assets/js/','/assets/js/')
              t=re.sub(r'<source[^>]+(?:/assets/video/nariyal-coconut-motion\.mp4)[^>]*/?>','',t,flags=re.I)
              t=re.sub(r'\s+src=["\']/assets/video/nariyal-coconut-motion\.mp4["\']','',t,flags=re.I)
              if p.name=='index.html':
                  t=re.sub(r'<script[^>]+src=["\']/assets/js/v17-cinematic\.js["\'][^>]*></script>','',t,flags=re.I)
                  t=re.sub(r'<script[^>]+src=["\']/assets/js/ns-smart-location\.js["\'][^>]*></script>','',t,flags=re.I)
              if t!=before: p.write_text(t)

          # Static asset audit for real HTML/CSS references. Build fails on any missing local path.
          missing=[]
          attr=re.compile(r'(?:src|href|poster)=["\']([^"\']+)["\']',re.I)
          cssurl=re.compile(r'url\(["\']?([^\)"\']+)',re.I)
          for p in root.rglob('*.html'):
              t=p.read_text(errors='ignore')
              for u in attr.findall(t):
                  if not (u.startswith('/assets/') or u.startswith('assets/')): continue
                  clean=u.split('?',1)[0].split('#',1)[0]
                  target=(root/clean.lstrip('/')) if clean.startswith('/') else (p.parent/clean)
                  if not target.exists(): missing.append((str(p.relative_to(root)),u))
          for p in root.rglob('*.css'):
              t=p.read_text(errors='ignore')
              for u in cssurl.findall(t):
                  if u.startswith(('http:','https:','data:','#')): continue
                  target=(p.parent/u.split('?',1)[0].split('#',1)[0]).resolve()
                  try: target.relative_to(root.resolve())
                  except ValueError: continue
                  if not target.exists(): missing.append((str(p.relative_to(root)),u))
          if missing:
              print('MISSING LOCAL ASSETS:')
              for row in missing: print(row)
              raise SystemExit(2)
          if any(old in p.read_text(errors='ignore') for p in root.rglob('*') if p.is_file() and p.suffix.lower() in text_ext): raise SystemExit('stale immutable Netlify reference remains')
          expected=['nariyal-premium-hero.webp','nariyal-hospitality.webp','nariyal-sutra-hero.jpg','nariyal-product-collection.webp','green-round-coconut.jpg','bulk-coconut-pack.jpg','brand/coconut-premium.webp','story-coconut-hero.png','story-coconut-body-cut.png','story-coconut-cap-cut.png','cinematic/coconut-rain-1.png','cinematic/coconut-rain-3.png','cinematic/coconut-rain-4.png','cinematic/coconut-rain-5.png']
          for name in expected:
              p=images/name
              if not p.exists() or p.stat().st_size<1000: raise SystemExit('missing generated asset '+name)
          PY

          grep -q "ns-film42-rain" dist/assets/js/v20-review-fixes.js
          grep -q "coconut-rain-" dist/assets/js/v20-review-fixes.js
          grep -q '^/admin /admin-preview.html 200$' dist/_redirects
          ! grep -R -q "6a9bfce307bb9f014e510b7d" dist --include='*.html' --include='*.css' --include='*.js' --include='*.json'
          echo "Prepared $(find dist -type f | wc -l) files"

      - name: Browser QA rain sequence and local assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist >/tmp/ns-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit >/dev/null 2>&1
          cat > ns-qa.mjs <<'JS'
          import { chromium, webkit } from 'playwright';
          const engines=[['chromium',chromium],['webkit',webkit]];
          const sizes=[['desktop',1440,900],['tablet',1024,768],['mobile',390,844]];
          for(const [engineName,engine] of engines){
            const browser=await engine.launch({headless:true});
            for(const [name,width,height] of sizes){
              const page=await browser.newPage({viewport:{width,height}}); const local404=[];
              page.on('response',r=>{if(r.url().startsWith('http://127.0.0.1:4173/')&&r.status()===404)local404.push(r.url())});
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForSelector('#ns-film42',{state:'attached',timeout:15000});
              const base=await page.evaluate(()=>({films:document.querySelectorAll('#ns-film42').length,legacy:document.querySelectorAll('#v20-story-film,.mobile-story-reel,#grove-story,#cut-story,#live-coconut-motion').length,rain:document.querySelectorAll('#ns-film42-rain img').length,bg:document.querySelector('.ns-film42-bg img')?.naturalWidth||0,hero:document.querySelector('.ns-film42-selected')?.naturalWidth||0,cut:document.querySelector('.ns-film42-cut-bg img')?.naturalWidth||0,scroll:document.documentElement.scrollWidth,view:innerWidth}));
              const minRain=width<=700?10:(width<=1024?16:30);
              if(base.films!==1||base.legacy!==0||base.rain!==minRain||!base.bg||!base.hero||!base.cut||base.scroll>base.view+2) throw new Error(engineName+' '+name+' base '+JSON.stringify(base)+' 404='+JSON.stringify(local404));
              await page.evaluate(()=>{const s=document.querySelector('#ns-film42'),range=Math.max(1,s.offsetHeight-innerHeight);scrollTo(0,s.offsetTop+range*.36)}); await page.waitForTimeout(450);
              const rain=await page.evaluate(()=>({opacity:+getComputedStyle(document.querySelector('#ns-film42-rain')).opacity,visible:[...document.querySelectorAll('#ns-film42-rain img')].filter(x=>+getComputedStyle(x).opacity>.25).length,count:+document.querySelector('#ns-film42-count').textContent}));
              if(rain.opacity<.75||rain.visible<5||rain.count<70) throw new Error(engineName+' '+name+' rain '+JSON.stringify(rain));
              await page.screenshot({path:`qa-${engineName}-${name}-RAIN.png`});
              await page.evaluate(()=>{const s=document.querySelector('#ns-film42'),range=Math.max(1,s.offsetHeight-innerHeight);scrollTo(0,s.offsetTop+range*.80)}); await page.waitForTimeout(450);
              const cut=await page.evaluate(()=>({cut:+getComputedStyle(document.querySelector('.ns-film42-cut-bg')).opacity,copy:+getComputedStyle(document.querySelector('.ns-film42-copy-cut')).opacity}));
              if(cut.cut<.70||cut.copy<.45) throw new Error(engineName+' '+name+' cut '+JSON.stringify(cut));
              await page.screenshot({path:`qa-${engineName}-${name}-CUT.png`});
              if(local404.length) throw new Error(engineName+' '+name+' local404 '+JSON.stringify(local404));
              await page.close();
            }
            await browser.close();
          }
          const browser=await chromium.launch({headless:true});
          const pages=['admin-preview.html','coconut-water.html','fresh-tender-coconut.html','green-coconut.html','bulk-coconut-supply.html','coconut-events-hospitality.html','freshness-first.html'];
          for(const path of pages){
            const page=await browser.newPage({viewport:{width:1280,height:800}}); const local404=[];
            page.on('response',r=>{if(r.url().startsWith('http://127.0.0.1:4173/')&&r.status()===404)local404.push(r.url())});
            await page.goto('http://127.0.0.1:4173/'+path,{waitUntil:'domcontentloaded',timeout:30000}); await page.waitForTimeout(500);
            if(local404.length) throw new Error(path+' local404 '+JSON.stringify(local404));
            if(path==='admin-preview.html'){const text=(await page.textContent('body'))||'';if(!/Delivery Hub/i.test(text)||!/Media Library/i.test(text)||!/Schedule/i.test(text))throw new Error('Admin OS smoke failed');await page.screenshot({path:'qa-admin.png'});}
            await page.close();
          }
          await browser.close();
          JS
          node ./ns-qa.mjs
          rm -f ns-qa.mjs

      - name: Create V42.3 deploy ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=NARIYAL_SUTRA_V42_3_ASSET_COMPLETE_RAIN_RESTORED_2026-09-11.zip
          (cd dist && zip -qr ../$ZIP .)
          unzip -t "$ZIP" >/dev/null
          COUNT=$(unzip -Z1 "$ZIP" | wc -l)
          echo "ZIP entries: $COUNT"
          test "$COUNT" -gt 220

      - name: Upload V42.3 package and QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: nariyal-sutra-v42-3-asset-complete-rain-restored
          path: |
            NARIYAL_SUTRA_V42_3_ASSET_COMPLETE_RAIN_RESTORED_2026-09-11.zip
            qa-*.png
          if-no-files-found: error
          retention-days: 7
