name: V42.1 recovery safe QA

on:
  push:
    branches:
      - fix/v421-prod-logout-loop-20261011
    paths:
      - 'index.html'
      - 'coconut-buying-guide.html'
      - 'scripts/seo-customer-discovery-qa.mjs'
      - 'scripts/v421-media-map-regression-qa.mjs'
      - 'scripts/checkout-location-sync-qa.mjs'
      - 'assets/js/admin-v21.js'
      - 'assets/js/v21-public.js'
      - 'assets/js/map.js'
      - 'admin-bcc-login.html'
      - 'assets/js/v421-production-bridge.js'
      - 'assets/js/live-catalog.js'
      - 'ns-delivery.js'
      - 'ns-order-patch.js'
      - 'scripts/v421-*.mjs'
      - 'scripts/price-sync-qa.mjs'
      - 'scripts/production-firebase-contract-qa.mjs'
      - 'scripts/netlify-release-boundary-qa.mjs'
      - 'scripts/seo-go-live-acceptance.mjs'
      - '.github/workflows/v421-recovery-qa.yml'
  workflow_dispatch:

# No deploys, Firebase credentials, live requests, external providers, caches,
# billable third-party browser agents or uploaded build artifacts.
permissions:
  contents: read

concurrency:
  group: v421-recovery-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact recovery commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source parse and offline recovery regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/v421-production-bridge.js
          node --check ns-delivery.js
          node --check ns-order-patch.js
          node scripts/v421-logout-flow-qa.mjs
          node scripts/v421-admin-auth-session-qa.mjs
          node scripts/v421-media-map-regression-qa.mjs
          node scripts/v421-checkout-recap-qa.mjs
          node scripts/v421-destination-data-qa.mjs
      - name: Firebase, Netlify and price contracts without remote writes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/price-sync-qa.mjs
          node scripts/production-firebase-contract-qa.mjs
          node scripts/netlify-release-boundary-qa.mjs
          node scripts/seo-go-live-acceptance.mjs
          node scripts/seo-customer-discovery-qa.mjs

  local-browser-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact recovery commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ephemeral test-only browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify checkout against localhost with all external requests blocked
        run: node scripts/v421-browser-checkout-local-qa.mjs
      - name: Verify mobile checkout GPS and pin-to-address sync with mocked geocoder
        run: node scripts/checkout-location-sync-qa.mjs

  release-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact recovery commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build static publish directory locally (no Netlify API or deployment)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-netlify-site.mjs
          test -f dist-site/index.html
          test -f dist-site/llms.txt
          test -f dist-site/robots.txt
          test -f dist-site/sitemap.xml
          test ! -e dist-site/docs
          test ! -e dist-site/scripts
          test ! -e dist-site/netlify
      - name: Package actual five Netlify Functions with ephemeral bundler
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts @netlify/zip-it-and-ship-it esbuild
          node scripts/netlify-function-package-qa.mjs
