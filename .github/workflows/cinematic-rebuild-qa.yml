name: Cinematic rebuild QA
on:
  push:
    branches: [fix/cinematic-real-sequence-20260911]
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/predeploy-audit.mjs
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node scripts/cinematic-rebuild-qa.mjs
      - name: Upload cinematic QA frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinematic-rebuild-frames
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
