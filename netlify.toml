[build]
  command = "node scripts/build-netlify-site.mjs"
  publish = "dist-site"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  framework = "#static"
  publish = ".netlify-dev"
  port = 8888
  autoLaunch = false

# This review branch is CI-only until the Owner explicitly approves deployment.
[context."feature/storefront-themes"]
  ignore = "exit 0"
  command = "node -e \"throw new Error('Review branch: deployment is disabled')\""
