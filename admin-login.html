<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Staff Preview | Nariyal Sutra</title><link rel="stylesheet" href="assets/css/auth-shell.css"></head>
<body class="ns-auth-page"><script>if(!["localhost","127.0.0.1","::1","[::1]"].includes(location.hostname))location.replace("/admin-bcc-login.html");</script><main id="ns-admin-auth">
<h1 class="ns-auth-title" id="ns-admin-title" tabindex="-1">Welcome back.</h1>
<p class="ns-auth-sub" id="ns-admin-sub">Sign in to your Nariyal Sutra workspace.</p>
<form id="login" data-auth-mode="signin">
<div><label for="email">Staff email</label><input autocomplete="username" id="email" type="email" placeholder="you@example.com" required></div>
<div id="ns-admin-password"><label for="pw">Password</label><input autocomplete="current-password" id="pw" type="password" placeholder="Your password" required></div>
<button class="ns-auth-primary" id="submit" type="submit">Sign in</button>
<button class="ns-auth-text" id="forgot" type="button">Forgot password?</button>
<button class="ns-auth-text" id="ns-admin-back" type="button" hidden>Back to sign in</button>
<button id="local-reset" hidden type="button">Generate local reset</button></form><div class="msg" id="msg" role="status" aria-live="polite" aria-atomic="true"></div>
<p class="ns-auth-note">Local staff preview. Invited account setup and password verification are required. Live Admin uses secure identity and assigned-role checks.</p>
</main><script src="assets/js/auth-shell.js"></script><script src="assets/js/admin-auth-ui.js"></script><script src="assets/js/v421-local-store.js"></script><script>
(function(){const S=window.NSV421Store,msg=document.getElementById('msg');function b64(a){return btoa(String.fromCharCode(...a))}async function digest(salt,pw){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return b64(new Uint8Array(h))}document.getElementById('login').onsubmit=async e=>{e.preventDefault();if(e.target.dataset.authMode==='reset'){document.getElementById('local-reset').click();return}const s=S.load(),email=document.getElementById('email').value.trim().toLowerCase(),m=(s.teamMembers||[]).find(x=>x.email===email);if(!m||m.status!=='Active'||!m.passwordVerifier){msg.className='msg err';msg.textContent='Account is not active or setup is incomplete.';return}if(await digest(m.passwordVerifier.salt,document.getElementById('pw').value)!==m.passwordVerifier.hash){msg.className='msg err';msg.textContent='Email or password is incorrect.';return}m.lastLogin=new Date().toISOString();S.audit(s,'team.login',m.email);S.save(s);sessionStorage.setItem('ns_v10_admin_session',JSON.stringify({id:m.id,role:m.role,at:Date.now()}));msg.className='msg ok';msg.textContent='Signed in. Opening Admin…';setTimeout(()=>location.href='admin-preview.html',500)};document.getElementById('local-reset').onclick=()=>{const s=S.load(),email=document.getElementById('email').value.trim().toLowerCase(),m=(s.teamMembers||[]).find(x=>x.email===email);if(!m){msg.className='msg err';msg.textContent='Enter a valid staff login ID.';return}const token=crypto.randomUUID().replaceAll('-','')+crypto.randomUUID().replaceAll('-','');m.resetToken=token;m.resetExpiresAt=Date.now()+60*60*1000;S.audit(s,'team.password-reset-self-service',m.email);S.save(s);const link=location.origin+location.pathname.replace(/admin-login\.html.*$/,'')+'admin-set-password.html?reset='+encodeURIComponent(token);msg.className='msg ok';msg.innerHTML='Local preview reset email generated. <a href="'+link+'">Open password-reset link</a><br><code>'+link+'</code>'}})();
</script></body></html>
